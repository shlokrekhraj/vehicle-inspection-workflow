# Usage (from the repo root):
#   docker compose -f ansible/docker-compose.yml build
#   docker compose -f ansible/docker-compose.yml run --rm -T ansible ansible-playbook playbooks/site.yml
services:
  ansible:
    build: .
    image: vi-ansible-controller:1.0
    volumes:
      - ..:/workspace                                   # repo (playbooks + target/*.jar)
      - /var/run/docker.sock:/var/run/docker.sock       # lets Ansible manage Docker on this PC
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD first}
      APP_VERSION: ${APP_VERSION:-1.3.0}
    working_dir: /workspace/ansible
