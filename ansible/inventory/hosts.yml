# Inventory for the Vehicle Inspection Workflow.
# "control" is the Ansible container itself (it talks to Docker to provision nodes).
# "app_nodes" are the target servers, reached with the Docker CLI connection (docker exec / docker cp).
all:
  children:
    control:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: /usr/local/bin/python3
    app_nodes:
      hosts:
        vi-node1:
          ansible_connection: community.docker.docker
          ansible_python_interpreter: /usr/bin/python3
          node_http_port: 8095
