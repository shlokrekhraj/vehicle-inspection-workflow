spring.application.name=vehicle-inspection-workflow

server.port=${APP_PORT:8080}

# Database - every value can be overridden with an environment variable,
# which is how Jenkins, Docker and Ansible point the app at their own MySQL.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_inspection_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Health check used by Jenkins, Docker HEALTHCHECK and Ansible
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Vehicle Inspection Workflow
info.app.version=${APP_VERSION:dev}
info.app.environment=${APP_ENV:local}
